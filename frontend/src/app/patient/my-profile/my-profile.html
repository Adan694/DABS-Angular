<app-navbar></app-navbar>
<div class="wrapper">
  <div class="main-container">
    <div class="profile-container">
      <h2>Profile</h2>
      <div class="profile-info" *ngIf="!isEditing">
        <label><i class="fas fa-user"></i> Name:</label>
        <p>{{ profile.name }}</p>

        <label><i class="fas fa-envelope"></i> Email:</label>
        <p>{{ profile.email }}</p>

        <label><i class="fas fa-phone"></i> Phone:</label>
        <p>{{ profile.phone }}</p>

        <label><i class="fas fa-birthday-cake"></i> Age:</label>
        <p>{{ profile.age }}</p>

        <label><i class="fas fa-calendar-alt"></i> Date of Birth:</label>
        <p>{{ profile.dob }}</p>

        <label><i class="fas fa-venus-mars"></i> Gender:</label>
        <p>{{ profile.gender }}</p>

        <label><i class="fas fa-id-card"></i> CNIC:</label>
        <p>{{ profile.cnic }}</p>
      </div>

      <form *ngIf="isEditing" (ngSubmit)="updateProfile()" class="profile-info">
        <label>Name:</label>
        <input type="text" [(ngModel)]="profile.name" name="name" class="form-control" required />

        <label>Email:</label>
        <input
          type="email"
          [(ngModel)]="profile.email"
          name="email"
          class="form-control"
          required
        />

        <label>Phone:</label>
        <input type="text" [(ngModel)]="profile.phone" name="phone" class="form-control" required />

        <label>Date of Birth:</label>
        <input
          type="date"
          [(ngModel)]="profile.dob"
          name="dob"
          class="form-control"
          (change)="calculateAge()"
        />

        <label>Gender:</label>
        <select [(ngModel)]="profile.gender" name="gender" class="form-control">
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>

        <label>CNIC:</label>
        <input type="text" [(ngModel)]="profile.cnic" name="cnic" class="form-control" />

        <div class="mt-3 d-flex gap-2">
          <button type="submit" class="w-100">Update</button>
          <button type="button" class="btn btn-danger w-100" (click)="cancelEdit()">Cancel</button>
        </div>
      </form>

      <button *ngIf="!isEditing" class="edit-button" (click)="editProfile()">Edit Profile</button>
    </div>
  </div>

  <div id="loader" *ngIf="loading">Loading...</div>
</div>
<!-- 💬 Floating Chat Button -->
<button class="chat-float-btn" (click)="goToChat()" title="Chat with Admin">
  <i class="fas fa-comments"></i>
  <span *ngIf="unreadCount > 0" class="chat-notification">
    {{ unreadCount > 9 ? '9+' : unreadCount }}
  </span>
</button>

<app-footer></app-footer>
