<div class="admin-layout container-fluid">
  <div class="row">
    <!-- ===== SIDEBAR ===== -->
    <app-admin-sidebar class="sidebar col-12 col-md-3 col-lg-2 p-0"></app-admin-sidebar>

    <!-- ===== OVERLAY ===== -->
    <div id="overlay" class="d-md-none"></div>

    <div class="main-content">
      <div class="header">
        <i id="bar" class="fa-solid fa-bars"></i>
        <h1>Add Doctors</h1>
        <button class="logout-btn" (click)="logout()">Logout</button>
      </div>

      <div class="form-container">
        <form [formGroup]="doctorForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data">
          <div class="form-group">
            <label for="name">Your Name</label>
            <input id="name" formControlName="name" placeholder="Name" />
            <small
              *ngIf="doctorForm.get('name')?.invalid && doctorForm.get('name')?.touched"
              class="text-danger"
            >
              Name must be at least 3 characters.
            </small>
          </div>

          <div class="form-group">
            <label for="email">Doctor Email</label>
            <input id="email" type="email" formControlName="email" placeholder="Email" />
            <small
              *ngIf="doctorForm.get('email')?.invalid && doctorForm.get('email')?.touched"
              class="text-danger"
            >
              Invalid email format.
            </small>
          </div>

          <div class="form-group">
            <label for="password">Set Password</label>
            <input
              id="password"
              type="password"
              formControlName="password"
              placeholder="Password"
            />
            <small
              *ngIf="doctorForm.get('password')?.invalid && doctorForm.get('password')?.touched"
              class="text-danger"
            >
              Must include 1 letter, 1 number & 1 special character.
            </small>
          </div>

          <div class="form-group">
            <label for="speciality">Speciality</label>
            <select id="speciality" formControlName="speciality">
              <optgroup label="Primary Care">
                <option value="general">General Physician</option>
                <option value="pediatrician">Pediatrician</option>
              </optgroup>
              <optgroup label="Internal Medicine Subspecialties">
                <option value="cardiologist">Cardiologist</option>
                <option value="gastroenterologist">Gastroenterologist</option>
                <option value="nephrologist">Nephrologist</option>
                <option value="oncologist">Oncologist</option>
                <option value="pulmonologist">Pulmonologist</option>
              </optgroup>
              <optgroup label="Surgical Specialties">
                <option value="orthopedist">Orthopedist</option>
                <option value="plastic-surgeon">Plastic Surgeon</option>
                <option value="surgeon">General Surgeon</option>
                <option value="vascular-surgeon">Vascular Surgeon</option>
              </optgroup>
            </select>
          </div>

          <div class="form-group">
            <label for="degree">Degree</label>
            <input id="degree" formControlName="degree" placeholder="Degree" />
          </div>

          <div class="form-group">
            <label for="experience">Experience</label>
            <input id="experience" formControlName="experience" placeholder="e.g., 1 Year" />
          </div>

          <div class="form-group">
            <label for="about">About Doctor</label>
            <textarea
              id="about"
              formControlName="about"
              rows="4"
              placeholder="Write about the doctor"
            ></textarea>
          </div>

          <div class="form-group">
            <label for="available">Availability</label>
            <select id="available" formControlName="available">
              <option value="true">Available</option>
              <option value="false">Not Available</option>
            </select>
          </div>

          <button type="submit" class="btn" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Submitting...' : 'Add Doctor' }}
          </button>

          <div *ngIf="successMessage" class="success-message text-success">
            {{ successMessage }}
          </div>
          <div *ngIf="errorMessage" class="error-message text-danger">{{ errorMessage }}</div>
        </form>
      </div>
    </div>
  </div>
</div>
