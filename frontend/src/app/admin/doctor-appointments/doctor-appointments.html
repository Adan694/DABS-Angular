<div class="content container-fluid p-3">
  <div class="header d-flex justify-content-between align-items-center">
    <!-- Back Button -->
    <button class="btn btn-primary back-btn" (click)="goBack()">
      <i class="fa-solid fa-arrow-left me-2"></i> Back to Doctors
    </button>

    <h1>{{ doctorNameHeading }}</h1>

    <button class="btn btn-success logout-button" (click)="logout()">Logout</button>
  </div>

  <div id="appointmentsList" class="mt-3">
    <div *ngIf="loading" class="text-center text-muted">Loading...</div>

    <div *ngIf="!loading && appointments.length === 0" class="text-center text-secondary">
      No appointments found for this doctor.
    </div>

    <div *ngFor="let app of paginatedAppointments()" class="appointment-card mb-3">
      <div class="header d-flex justify-content-between align-items-center">
        <span>Appointment</span>
        <span class="status" [ngClass]="app.status.toLowerCase()">{{ app.status }}</span>
      </div>
      <div class="body">
        <p class="patient"><strong>Patient:</strong> {{ getPatientName(app) }}</p>
        <p class="date"><strong>Date:</strong> {{ parseAppointmentDate(app.date, app.time) }}</p>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <div class="pagination mt-4 text-center">
    <button class="prev-btn" [disabled]="currentPage === 1" (click)="prevPage()">Previous</button>
    <span class="page-info">Page {{ currentPage }} of {{ totalPages() }}</span>
    <button class="next-btn" [disabled]="currentPage === totalPages()" (click)="nextPage()">
      Next
    </button>
  </div>
</div>
